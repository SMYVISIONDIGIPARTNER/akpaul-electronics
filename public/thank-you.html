<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta name="robots" content="noindex, nofollow" />

  <title>Thank You | AK Paul Electronics</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;

      background: #f5f7f9;

      font-family: Arial, Helvetica, sans-serif;
    }

    .thank-you-card {
      width: 100%;
      max-width: 600px;

      padding: 55px 35px;

      background: #ffffff;

      text-align: center;

      border-radius: 8px;

      box-shadow: 0 15px 50px rgba(3, 46, 79, 0.12);
    }

    .success-icon {
      width: 80px;
      height: 80px;

      margin: 0 auto 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #25d366;
      color: #ffffff;

      font-size: 40px;
      font-weight: bold;
    }

    h1 {
      margin-bottom: 15px;

      color: #032e4f;

      font-size: 38px;
    }

    p {
      max-width: 470px;

      margin: 0 auto;

      color: #687781;

      font-size: 17px;

      line-height: 1.7;
    }

    .highlight {
      color: #d7192d;

      font-weight: 700;
    }

    .actions {
      margin-top: 30px;

      display: flex;
      justify-content: center;
      flex-wrap: wrap;

      gap: 12px;
    }

    .home-btn,
    .call-btn {
      min-height: 50px;

      padding: 0 24px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 4px;

      text-decoration: none;

      font-size: 14px;
      font-weight: 700;
    }

    .home-btn {
      background: #032e4f;
      color: #ffffff;
    }

    .call-btn {
      background: #25d366;
      color: #ffffff;
    }

    @media (max-width: 600px) {
      .thank-you-card {
        padding: 40px 20px;
      }

      .success-icon {
        width: 68px;
        height: 68px;

        font-size: 32px;
      }

      h1 {
        font-size: 29px;
      }

      p {
        font-size: 15px;
      }

      .actions {
        flex-direction: column;
      }

      .home-btn,
      .call-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="thank-you-card">

    <div class="success-icon">
      ✓
    </div>

    <h1>Thank You!</h1>

    <p>
      Thank you for submitting your enquiry.
      <span class="highlight">
        Our team will get back to you soon.
      </span>
    </p>

    <div class="actions">

      <a
        href="https://customerserviceonline.co.in/"
        class="home-btn"
      >
        Back to Home
      </a>

      <a
        href="tel:18001234042"
        class="call-btn"
      >
        ☎ Call 1800 1234 042
      </a>

    </div>

  </div>

</body>
</html>
